[package]
name = "www-authenticate-repro"
version = "0.0.0"
edition = "2024"
publish = false
description = "Minimal MCP server + SDK client probe reproducing rust-sdk #1418 and #1419"

# Stand-alone: not a member of the repository workspace, so it builds against
# whichever `crates/rmcp` checkout sits next to it.
[workspace]

[dependencies]
rmcp = { path = "../crates/rmcp", features = [
    "server",
    "client",
    "auth",
    "reqwest",
    "transport-streamable-http-server",
    "transport-streamable-http-client-reqwest",
] }
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
futures = "0.3"
http = "1"
reqwest = { version = "0.13.2", default-features = false, features = ["rustls"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
url = "2"
